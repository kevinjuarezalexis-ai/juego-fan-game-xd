<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marcar zoom</title>
<style>
  :root { --bg: #15110e; --panel: #241b15; --text: #f3e6d6; --muted: #b7a48f; --acc: #ffd23f; --red: #ff4a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 6px; color: var(--acc); }
  p { margin: 4px 0 10px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
  label { display: flex; gap: 6px; align-items: center; }
  input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid #5a4636; border-radius: 6px; padding: 6px 10px; }
  input[type=number] { width: 90px; }
  button { cursor: pointer; background: #3a2a1d; }
  button.main { background: var(--acc); color: #2a1a08; font-weight: 700; border-color: #c99b10; }
  canvas { display: block; width: 100%; height: auto; border-radius: 8px; background: #000; }
  textarea { width: 100%; height: 90px; font-family: ui-monospace, monospace; font-size: 13px; }
  kbd { background: #3a2a1d; border: 1px solid #5a4636; border-bottom-width: 3px; border-radius: 4px; padding: 0 6px; font-size: 13px; color: var(--text); }
  .info { font-family: ui-monospace, monospace; color: var(--acc); }
</style>
</head>
<body>
<main>
  <h1>Marcar zoom</h1>
  <p>Mantené <kbd>↑</kbd> para subir y <kbd>↓</kbd> para bajar mientras suena la canción. Lo que marcás queda grabado en la curva de abajo; si volvés a pasar por la misma parte, se pisa. <kbd>Espacio</kbd> reproduce o pausa · <kbd>R</kbd> vuelve al inicio del tramo.</p>
  <div class="row">
    <label>Desde (seg) <input id="desde" type="number" step="0.01" value="235.62" /></label>
    <label>Hasta (seg) <input id="hasta" type="number" step="0.01" value="272" /></label>
    <label>Qué marco
      <select id="modo">
        <option value="cam">Zoom de la cámara (acercarse / alejarse)</option>
        <option value="beat">Fuerza del zoom de cada beat</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button class="main" id="play">▶ Reproducir</button>
    <button id="inicio">⏮ Al inicio</button>
    <button id="borrar">Borrar lo marcado</button>
    <span class="info" id="estado">—</span>
  </div>
  <canvas id="cv" width="960" height="540"></canvas>
  <div class="row"><b>Resultado</b> (copialo y pasámelo):</div>
  <textarea id="out" readonly></textarea>
  <div class="row"><button class="main" id="copiar">Copiar resultado</button><span id="msg"></span></div>
</main>
<script>
  const BPM = 146, OFF = 0.36, CRO = 60 / BPM;
  const $ = (id) => document.getElementById(id);
  const audio = new Audio('src/assets/music/fiesta.mp3');
  audio.preload = 'auto';
  const fondo = new Image();
  fondo.src = 'src/assets/fondo/fondo1.jpg';
  const cv = $('cv'), ctx = cv.getContext('2d');

  let nivel = 0; // 0..1
  const teclas = { up: false, down: false };
  const marcas = new Map(); // tiempo (décimas) → nivel
  let bumpZ = 0, ultimoBeat = -1, ultimoT = performance.now();

  const desde = () => +$('desde').value || 0;
  const hasta = () => +$('hasta').value || desde() + 30;
  const fmt = (t) => Math.floor(t / 60) + ':' + (t % 60).toFixed(2).padStart(5, '0');

  function alInicio() {
    audio.currentTime = desde();
    const k = Math.round(desde() * 10);
    nivel = marcas.has(k) ? marcas.get(k) : 0;
  }
  function play() {
    if (audio.paused) {
      if (audio.currentTime < desde() - 0.05 || audio.currentTime > hasta()) alInicio();
      audio.play();
    } else audio.pause();
  }
  $('play').onclick = play;
  $('inicio').onclick = alInicio;
  $('borrar').onclick = () => { marcas.clear(); salida(); };
  audio.addEventListener('play', () => ($('play').textContent = '⏸ Pausa'));
  audio.addEventListener('pause', () => ($('play').textContent = '▶ Reproducir'));
  audio.addEventListener('loadedmetadata', alInicio, { once: true });
  ['desde', 'hasta'].forEach((id) => $(id).addEventListener('change', () => { alInicio(); salida(); }));
  $('modo').addEventListener('change', salida);

  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'ArrowUp') (teclas.up = true), e.preventDefault();
    else if (e.code === 'ArrowDown') (teclas.down = true), e.preventDefault();
    else if (e.code === 'Space') (play(), e.preventDefault());
    else if (e.code === 'KeyR') alInicio();
  });
  addEventListener('keyup', (e) => {
    if (e.code === 'ArrowUp') teclas.up = false;
    if (e.code === 'ArrowDown') teclas.down = false;
  });

  // resultado: sólo los puntos donde cambia (para que sea corto)
  function salida() {
    const ks = [...marcas.keys()].filter((k) => k / 10 >= desde() - 0.05 && k / 10 <= hasta() + 0.05).sort((a, b) => a - b);
    const pts = [];
    ks.forEach((k, i) => {
      const v = marcas.get(k);
      const prev = pts.length ? pts[pts.length - 1][1] : null;
      const next = i + 1 < ks.length ? marcas.get(ks[i + 1]) : null;
      if (prev === null || i === ks.length - 1 || Math.abs(v - prev) >= 0.03 || (next !== null && Math.sign(next - v) !== Math.sign(v - prev)))
        pts.push([k / 10, v]);
    });
    $('out').value = pts.length ? 'modo: ' + $('modo').value + '\n' + pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(2)).join(' ') : '';
  }
  $('copiar').onclick = async () => {
    salida();
    try { await navigator.clipboard.writeText($('out').value); $('msg').textContent = '¡Copiado!'; }
    catch (e) { $('out').select(); document.execCommand('copy'); $('msg').textContent = 'Copiado'; }
    setTimeout(() => ($('msg').textContent = ''), 1500);
  };

  function frame(now) {
    const dt = Math.min(0.1, (now - ultimoT) / 1000);
    ultimoT = now;
    const t = audio.currentTime;
    const sonando = !audio.paused;
    if (teclas.up) nivel = Math.min(1, nivel + dt * 1.1);
    if (teclas.down) nivel = Math.max(0, nivel - dt * 1.1);
    const dentro = t >= desde() - 0.05 && t <= hasta();
    if (sonando && dentro) {
      marcas.set(Math.round(t * 10), nivel);
      if (Math.floor(now / 250) !== Math.floor((now - dt * 1000) / 250)) salida();
    }
    if (sonando && t > hasta()) audio.pause();
    // beat
    const b = Math.floor((t - OFF) / CRO);
    if (sonando && b !== ultimoBeat) {
      ultimoBeat = b;
      if ($('modo').value === 'beat') bumpZ += 0.14 * nivel;
    }
    bumpZ *= Math.pow(0.0008, dt);
    const z = $('modo').value === 'beat' ? 1 + bumpZ : 1 + nivel * 0.6 + bumpZ;
    dibujar(t, z, b);
    $('estado').textContent = fmt(t) + '  ·  nivel ' + Math.round(nivel * 100) + '%';
    requestAnimationFrame(frame);
  }

  function dibujar(t, z, b) {
    const W = cv.width, H = cv.height, GH = 120, PH = H - GH;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    // vista previa (el patio con el zoom)
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, PH); ctx.clip();
    ctx.translate(W / 2, PH / 2); ctx.scale(z, z); ctx.translate(-W / 2, -PH / 2);
    if (fondo.complete && fondo.naturalWidth) {
      const s = Math.max(W / fondo.naturalWidth, PH / fondo.naturalHeight);
      ctx.drawImage(fondo, (W - fondo.naturalWidth * s) / 2, (PH - fondo.naturalHeight * s) / 2, fondo.naturalWidth * s, fondo.naturalHeight * s);
    }
    ctx.restore();
    // beat
    const fr = (t - OFF) / CRO - Math.floor((t - OFF) / CRO);
    ctx.fillStyle = 'rgba(255,210,63,' + Math.max(0, 1 - fr * 3) + ')';
    ctx.beginPath(); ctx.arc(30, 30, 12, 0, Math.PI * 2); ctx.fill();
    // barra de nivel
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W - 46, 20, 26, PH - 40);
    ctx.fillStyle = teclas.up ? '#7dff9a' : teclas.down ? '#ff8080' : '#ffd23f';
    const bh = (PH - 44) * nivel; ctx.fillRect(W - 44, PH - 22 - bh, 22, bh);
    // curva grabada
    const y0 = PH, d = desde(), h = hasta();
    ctx.fillStyle = '#1d1611'; ctx.fillRect(0, y0, W, GH);
    const X = (tt) => ((tt - d) / (h - d)) * W, Y = (v) => y0 + GH - 10 - v * (GH - 20);
    // líneas de beat
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    for (let bb = Math.ceil((d - OFF) / CRO); OFF + bb * CRO < h; bb++) { const x = X(OFF + bb * CRO); ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + GH); ctx.stroke(); }
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.beginPath();
    let first = true;
    [...marcas.keys()].sort((a, b) => a - b).forEach((k) => {
      const tt = k / 10; if (tt < d - 0.05 || tt > h + 0.05) return;
      const x = X(tt), y = Y(marcas.get(k));
      if (first) ctx.moveTo(x, y), (first = false); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.fillStyle = '#ff4a3a'; ctx.fillRect(X(t) - 1, y0, 2, GH);
    ctx.fillStyle = '#b7a48f'; ctx.font = '12px monospace';
    ctx.fillText(fmt(d), 6, y0 + 14); ctx.textAlign = 'right'; ctx.fillText(fmt(h), W - 6, y0 + 14); ctx.textAlign = 'left';
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
